[package]
name = "en-croissant"
version = "0.15.1"
description = "A Modern Chess Database"
authors = ["Francisco Salgueiro <fgcdbs@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/franciscoBSalgueiro/en-croissant"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.2", features = ["protocol-asset"], optional = true }
zip = "2.1.6"
tokio = { version = "1.33", features = ["full"] }
futures-util = "0.3.24"
flate2 = "1"
reqwest = { version = "0.12.5", features = ["stream", "blocking", "json"] }
shakmaty = "0.27.1"
pgn-reader = "0.26.0"
csv = "1.1.6"
lazy_static = "1.4.0"
btoi = "0.4.2"
rusqlite = { version = "0.28.0", features = ["bundled"] }
bzip2 = "0.4.3"
zstd = "0.13"
diesel = { version = "2.0.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
rayon = "1.6.1"
chrono = "0.4.23"
derivative = "2.2.0"
dashmap = "6.0.1"
once_cell = "1.17.1"
rand = "0.8.5"
vampirc-uci = { git = "https://github.com/franciscoBSalgueiro/vampirc-uci", rev = "0d2b70d1e9cc6fb2159717a7252e1e080c25bd53", features = [
  "specta",
  "serde",
] }
tempfile = "3.6.0"
specta = { version = "^2.0.0-rc.20", features = ["derive"] }
tauri-specta = { version = "^2.0.0-rc.20", features = ["derive", "typescript"], optional = true }
strsim = "0.11.0"
thiserror = "2"
log = "0.4.20"
oauth2 = { version = "4.4.2", optional = true }
axum = { version = "0.6.20", optional = true }
tar = "0.4.40"
sysinfo = "0.29.10"
governor = "0.6.3"
nonzero_ext = "0.3.0"
specta-typescript = { version = "0.0.9", optional = true }
tauri-plugin-http = { version = "2.5.7", optional = true }
tauri-plugin-fs = { version = "2.4.5", optional = true }
tauri-plugin-dialog = { version = "2.6.0", optional = true }
tauri-plugin-os = { version = "2.3.2", optional = true }
tauri-plugin-cli = { version = "2.4.1", optional = true }
tauri-plugin-updater = { version = "2.10.0", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-log = { version = "2.8.0", optional = true }
tauri-plugin-window-state = { version = "2.4.1", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2.0.0", optional = true }
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"], optional = true }
memmap2 = "0.9"
rkyv = { version = "0.8", features = ["bytecheck"] }
polyglot-book-rs = "0.1.0"

[lib]
name = "en_croissant"
path = "src/lib.rs"

[[bin]]
name = "en-croissant"
path = "src/main.rs"
required-features = ["tauri"]

[features]
default = ["tauri", "custom-protocol"]
# Desktop build: Tauri runtime, plugins, OAuth, sound server.
tauri = [
  "dep:tauri",
  "dep:tauri-specta",
  "dep:specta-typescript",
  "dep:tauri-plugin-http",
  "dep:tauri-plugin-fs",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-os",
  "dep:tauri-plugin-cli",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-log",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-single-instance",
  "dep:oauth2",
  "dep:axum",
]
# Headless build consumed by ../server. Mutually exclusive with `tauri`.
server = []
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri?/custom-protocol"]
