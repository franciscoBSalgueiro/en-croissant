name: iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - ios
    tags:
      - "ios-v*"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Intel macOS runners: the arm64 pool is often at capacity
    runs-on: macos-15-intel
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Xcode project
        run: pnpm tauri ios init --ci

      - name: Generate iOS app icons
        run: pnpm tauri icon src-tauri/icons/icon.png --ios-color "#1a1b1e"

      - name: Build unsigned IPA
        env:
          CI: true
        run: pnpm tauri ios build --no-sign --ci

      - name: Collect IPA
        id: ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n 1)
          test -n "$IPA"
          cp "$IPA" "out/en-croissant-${VERSION}-ios-unsigned.ipa"
          ls -la out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ios-v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-ios-unsigned
          path: out/*.ipa
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ipa.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: En Croissant ${{ steps.ipa.outputs.version }} für iOS (${{ steps.ipa.outputs.tag }})
          prerelease: ${{ steps.ipa.outputs.prerelease }}
          files: out/*.ipa
          fail_on_unmatched_files: true
          body: |
            Unsignierte iOS-Version von En Croissant ${{ steps.ipa.outputs.version }} (arm64, ab iOS 15).

            **Installation:** Die `.ipa` mit Sideloadly oder AltStore und deiner Apple-ID signieren und installieren.
            Mit kostenloser Apple-ID läuft die App 7 Tage und muss dann neu signiert werden.

            **Enthalten:** Stockfish 19 (eingebaut, WebAssembly) für die Analyse.
            **Einschränkungen auf iOS:** keine externen Engine-Programme, keine DuckDB-Partiedatenbanken.
            Analysebrett, PGN-Dateien, Eröffnungen, Lichess/Chess.com und Puzzles sollten funktionieren.

            Commit: ${{ github.sha }}
